<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fixture - Page de rendez-vous</title>
</head>
<body>
<!--
  Page de test locale UNIQUEMENT (Phase 4, Lot 3 section 4 / Lot 4 section
  15/18): ne represente aucun site reel, ne contacte jamais TLScontact,
  aucune requete reseau. data-testid="fixture-appointment-page" est reconnu
  exclusivement par le detecteur fixture de l'agent
  (src/agent/agentPageDetector.ts) pour VALIDATE_BOT. Une fois la
  surveillance demarree (Lot 4), le moteur partage (src/shared/monitor.ts,
  detectors.ts) examine cette page avec exactement les MEMES selecteurs et
  motifs de texte que la production: cette fixture doit donc reproduire ces
  marqueurs fidelement pour chaque scenario, jamais une logique parallele.

  Scenarios pilotes par query string (?scenario=..., jamais actives
  implicitement: requiert toujours AGENT_TARGET_MODE=fixture +
  AGENT_FIXTURE_URL explicite):
    - no-slots (defaut): mois courant/suivant sans disponibilite, message
      officiel "plus de creneaux disponibles".
    - slot-available: un creneau disponible + reservation qui aboutit
      (contenu reconnu par hasReservationConfirmation), pour tester la
      detection ET l'alerte SLOT_DETECTED avec deduplication.
    - multi-slot: PLUSIEURS creneaux disponibles simultanement (le moteur
      selectionne et reserve le premier candidat actionable trouve).
    - month-change: mois courant indisponible, mois suivant disponible
      (teste le changement de mois et les delais associes).
    - rate-limited: texte "Error 1015" (motif rate-limit reconnu), qui se
      dissipe automatiquement apres clearAfterMs (defaut 30000) pour valider
      la reprise MONITORING (sortie de rate limit) sans dependre d'un vrai site.
    - refresh-required: etat "non pret" au premier chargement, devient pret
      seulement apres un reload() reel (sessionStorage), pour valider le
      refresh periodique reussi.
    - refresh-failed: reste TOUJOURS "non pret", meme apres reload() reel -
      pour valider REFRESH_FAILED (echecs consecutifs -> BOT_STATUS ERROR),
      jamais de boucle infinie.
    - invalid: page reconnue par VALIDATE_BOT (marqueur fixture present) mais
      dont le contenu ne correspond a AUCUN etat connu (ni pret, ni "aucun
      creneau" officiel) - simule une page inattendue/ambigue.
    - incomplete: DOM partiel (mois courant present, mois suivant ABSENT du
      DOM plutot que simplement desactive) - verifie la robustesse des
      detecteurs partages face a un element manquant plutot que desactive.
    - unavailable-style: bouton de creneau present dans le DOM mais rendu
      non actionable par CSS (pointer-events/opacite), jamais par l'attribut
      disabled - verifie que isActionable() le traite bien comme indisponible.

  Parametres additionnels: clearAfterMs (rate-limited), monthDelayMs
  (month-change/navigation lente, delai avant que le mois suivant affiche
  son contenu).

  Pour ajouter un nouveau scenario: ajouter une fonction renderXxx() ci-dessous
  qui peuple #fixture-root avec les MEMES data-testid/motifs de texte que la
  production (jamais une logique de detection parallele), puis un cas dans le
  switch en bas de ce script. Documenter le nouveau scenario dans ce
  commentaire et dans docs/agent-testing.md.
-->
<div data-testid="fixture-appointment-page">
  <div id="fixture-root"></div>
</div>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var scenario = params.get("scenario") || "no-slots";
  var root = document.getElementById("fixture-root");

  var NO_SLOTS_TEXT = "Nous n'avons actuellement plus de creneaux de rendez-vous disponibles.";
  var RESERVE_TEXT = "Reservez votre rendez-vous";
  var CONFIRMATION_TEXT = "Recapitulatif de la commande. Rendez-vous reserve pour le creneau selectionne.";

  var renderNoSlots = function () {
    root.innerHTML =
      '<button data-testid="btn-current-month-unavailable" disabled>Mois courant</button>' +
      '<button data-testid="btn-next-month-unavailable" disabled>Mois suivant</button>' +
      '<p>' + NO_SLOTS_TEXT + '</p>';
  };

  var attachReserveHandler = function () {
    var reserveBtn = document.getElementById("fixture-reserve-btn");
    if (!reserveBtn) { return; }
    reserveBtn.addEventListener("click", function () {
      document.getElementById("fixture-confirmation").textContent = CONFIRMATION_TEXT;
    });
  };

  var renderSlotAvailable = function () {
    root.innerHTML =
      '<button data-testid="btn-current-month-available">Mois courant</button>' +
      '<button data-testid="btn-available-slot">14:30</button>' +
      '<button id="fixture-reserve-btn">' + RESERVE_TEXT + '</button>' +
      '<div id="fixture-confirmation"></div>';
    attachReserveHandler();
  };

  var renderMultiSlot = function () {
    root.innerHTML =
      '<button data-testid="btn-current-month-available">Mois courant</button>' +
      '<button data-testid="btn-available-slot">09:00</button>' +
      '<button data-testid="btn-available-slot">11:15</button>' +
      '<button data-testid="btn-available-slot">16:45</button>' +
      '<button id="fixture-reserve-btn">' + RESERVE_TEXT + '</button>' +
      '<div id="fixture-confirmation"></div>';
    attachReserveHandler();
  };

  var renderMonthChange = function () {
    var delayMs = Number(params.get("monthDelayMs") || "0");
    root.innerHTML =
      '<button data-testid="btn-current-month-unavailable" disabled>Mois courant</button>' +
      '<button data-testid="btn-next-month-available">Mois suivant</button>' +
      '<div id="fixture-next-month"><p>Chargement du mois suivant...</p></div>';

    document.querySelector('[data-testid="btn-next-month-available"]').addEventListener("click", function () {
      var apply = function () {
        document.getElementById("fixture-next-month").innerHTML =
          '<button data-testid="btn-available-slot">09:00</button>' +
          '<p>Selectionnez un creneau</p>';
      };
      if (delayMs > 0) {
        setTimeout(apply, delayMs);
      } else {
        apply();
      }
    });
  };

  var renderRateLimited = function () {
    var clearAfterMs = Number(params.get("clearAfterMs") || "30000");
    root.innerHTML = '<p>Error 1015 - Acces temporairement limite (test).</p>';
    setTimeout(function () {
      renderNoSlots();
    }, clearAfterMs);
  };

  var renderRefreshRequired = function () {
    var reloadedKey = "rdv-fixture-refresh-required-reloaded";
    if (sessionStorage.getItem(reloadedKey) === "1") {
      renderNoSlots();
      return;
    }
    sessionStorage.setItem(reloadedKey, "1");
    root.innerHTML = "<p>Chargement en cours (etat volontairement non pret avant refresh)...</p>";
  };

  // Contrairement a refresh-required, ne devient JAMAIS pret, meme apres un
  // reload() reel: verifie que des refresh consecutifs qui echouent tous
  // aboutissent bien a REFRESH_FAILED / BOT_STATUS ERROR (agentMonitoringRuntime.ts),
  // jamais a une boucle infinie de refresh.
  var renderRefreshFailed = function () {
    root.innerHTML = "<p>Chargement en cours (ne devient jamais pret - test REFRESH_FAILED).</p>";
  };

  // Reconnue par VALIDATE_BOT (marqueur fixture present) mais dont le
  // contenu ne correspond a AUCUN etat connu du moteur partage: ni pret
  // (isAppointmentPageReady), ni "aucun creneau" officiel. Simule une page
  // inattendue/ambigue (ex. contenu partiellement charge, texte inconnu).
  var renderInvalid = function () {
    root.innerHTML = "<p>Contenu de test non reconnu par les detecteurs (scenario invalid).</p>";
  };

  // DOM partiel: le mois suivant est ABSENT (pas seulement desactive) -
  // verifie que les detecteurs partages restent robustes face a un element
  // manquant plutot que simplement inactif (readVisibleText/locator sur un
  // selecteur qui ne correspond a rien doit rester silencieux, jamais lever).
  var renderIncomplete = function () {
    root.innerHTML =
      '<button data-testid="btn-current-month-unavailable" disabled>Mois courant</button>' +
      '<p>Contenu incomplet (mois suivant absent du DOM).</p>';
  };

  // Le bouton de creneau existe dans le DOM (data-testid correct) mais est
  // rendu non actionable par CSS (opacite/pointer-events), jamais par
  // l'attribut disabled: verifie que isActionable() (detectors.ts) le
  // traite bien comme indisponible plutot que de tenter un clic dessus.
  var renderUnavailableStyle = function () {
    root.innerHTML =
      '<button data-testid="btn-current-month-available">Mois courant</button>' +
      '<button data-testid="btn-available-slot" style="pointer-events:none;opacity:0.2;">10:00</button>' +
      '<p>Creneau temporairement indisponible (style, pas attribut disabled).</p>';
  };

  switch (scenario) {
    case "slot-available":
      renderSlotAvailable();
      break;
    case "multi-slot":
      renderMultiSlot();
      break;
    case "month-change":
      renderMonthChange();
      break;
    case "refresh-failed":
      renderRefreshFailed();
      break;
    case "invalid":
      renderInvalid();
      break;
    case "incomplete":
      renderIncomplete();
      break;
    case "unavailable-style":
      renderUnavailableStyle();
      break;
    case "rate-limited":
      renderRateLimited();
      break;
    case "refresh-required":
      renderRefreshRequired();
      break;
    case "no-slots":
    default:
      renderNoSlots();
      break;
  }
})();
</script>
</body>
</html>
